services:
  - type: web
    name: fairblox-api
    runtime: node
    rootDir: .
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DISCORD_WEBHOOK_URL
        sync: false
      - key: APP_BASE_URL
        sync: false
      - key: API_BASE_URL
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false

staticSites:
  - name: fairblox-web
    rootDir: .
    buildCommand: npm install --include=dev && npm run build -w @fairblox/web
    publishPath: apps/web/dist
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: VITE_API_BASE_URL
        sync: false
      - key: VITE_UNITY_WEBGL_URL
        sync: false
